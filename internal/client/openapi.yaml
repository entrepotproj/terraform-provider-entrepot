openapi: 3.0.3
info:
  title: Entrepot API
  version: 1.0.0
  description: |
    Management API for Entrepot, a package repository manager.

    Authenticate with `Authorization: Bearer <token>` where the token is an
    Entrepot API token (`ent_…`), an OIDC access token from the configured
    identity provider, or a GitLab CI/CD `id_token`. Browser sessions use a
    cookie and must send `X-Entrepot-CSRF: 1` on state-changing requests.

    Package clients (pip, npm, docker, …) use the format endpoints under
    `/repository/{name}/` and `/v2/` instead of this API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - basicAuth: []
  - sessionCookie: []
tags:
  - name: system
  - name: blob-stores
  - name: repositories
  - name: components
  - name: security
  - name: scanning
  - name: cleanup
  - name: routing
  - name: metrics
paths:
  /system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Server information and enabled features
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: The calling principal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /maintenance/gc:
    post:
      tags: [system]
      operationId: runGC
      summary: Garbage-collect unreferenced blobs now (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /audit-events:
    get:
      tags: [system]
      operationId: listAuditEvents
      summary: Audit log, newest first (admin)
      description: Configuration changes, logins and other administrative events. Use `format=csv` to export.
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actor, in: query, description: Substring of the actor, schema: { type: string } }
        - { name: action, in: query, description: Action prefix, e.g. repository. or token.create, schema: { type: string } }
        - { name: target, in: query, description: Substring of the target, schema: { type: string } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/ExportFormat" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
            text/csv:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /blob-stores:
    get:
      tags: [blob-stores]
      operationId: listBlobStores
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlobStore" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [blob-stores]
      operationId: createBlobStore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobStoreInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        default: { $ref: "#/components/responses/Error" }
  /blob-stores/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [blob-stores]
      operationId: getBlobStore
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [blob-stores]
      operationId: updateBlobStore
      description: Updates the store configuration. The type cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobStoreInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobStore" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [blob-stores]
      operationId: deleteBlobStore
      description: Fails with 409 while repositories still use the store.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      description: Lists repositories the caller can read.
      parameters:
        - { name: format, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Repository" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [repositories]
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [repositories]
      operationId: getRepository
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [repositories]
      operationId: updateRepository
      description: Format, kind and blob store are immutable; other fields are replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      description: Deletes the repository and all of its content.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/assets:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [repositories]
      operationId: listAssets
      parameters:
        - { name: prefix, in: query, schema: { type: string } }
        - { name: after, in: query, description: Continuation token (path of the last item), schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPage" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/browse:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [repositories]
      operationId: browseRepository
      parameters:
        - { name: path, in: query, description: Directory path ("" for root, otherwise ending in "/"), schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BrowseEntry" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/components:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [components]
      operationId: listRepositoryComponents
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Component" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/upload:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [components]
      operationId: uploadComponent
      description: |
        Generic upload into a hosted repository.

        * **raw**: `file` plus `path` (defaults to the file name).
        * **pypi**: `file` is a wheel or sdist; name/version are read from the filename.
        * **npm**: `file` is a package tarball (`npm pack`); package.json is read from it.
        * **apt**: `file` is a .deb; optional `distribution` and `component`.
        * **yum**: `file` is an .rpm; optional `path` (directory).
        * **helm**: `file` is a packaged chart (.tgz).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                path: { type: string, description: "raw: destination path; yum: destination directory" }
                distribution: { type: string, description: "apt: distribution (default stable)" }
                component: { type: string, description: "apt: component (default main)" }
                tag: { type: string, description: "npm: dist-tag to set (default latest)" }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
        default: { $ref: "#/components/responses/Error" }

  /assets/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [components]
      operationId: getAsset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [components]
      operationId: deleteAsset
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /assets/{id}/content:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [components]
      operationId: downloadAsset
      responses:
        "200":
          description: The asset content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /components/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [components]
      operationId: getComponent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [components]
      operationId: deleteComponent
      description: Deletes the component and all of its assets.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /search:
    get:
      tags: [components]
      operationId: searchComponents
      parameters:
        - { name: q, in: query, description: Name substring, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: repository, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: scanState, in: query, description: Only components in this scan state, schema: { $ref: "#/components/schemas/ScanState" } }
        - { name: quarantined, in: query, description: Only quarantined (true) or not quarantined (false) components, schema: { type: boolean } }
        - name: withFindings
          in: query
          description: Include `findingCounts` and the most severe `findings` of each component
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Component" }
        default: { $ref: "#/components/responses/Error" }

  /tokens:
    get:
      tags: [security]
      operationId: listTokens
      summary: The caller's API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createToken
      summary: Create an API token for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenInput" }
      responses:
        "201":
          description: Created. The secret is only returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        default: { $ref: "#/components/responses/Error" }
  /tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    delete:
      tags: [security]
      operationId: deleteToken
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }
  /service-accounts:
    get:
      tags: [security]
      operationId: listServiceAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createServiceAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /service-accounts/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [security]
      operationId: getServiceAccount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      operationId: deleteServiceAccount
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /service-accounts/{name}/tokens:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [security]
      operationId: listServiceAccountTokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createServiceAccountToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        default: { $ref: "#/components/responses/Error" }
  /service-accounts/{name}/tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
      - { $ref: "#/components/parameters/ID" }
    delete:
      tags: [security]
      operationId: deleteServiceAccountToken
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [security]
      operationId: listUsers
      summary: Users seen via OIDC and service accounts (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /roles:
    get:
      tags: [security]
      operationId: listRoles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }
  /roles/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [security]
      operationId: getRole
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [security]
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      operationId: deleteRole
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /role-bindings:
    get:
      tags: [security]
      operationId: listRoleBindings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleBinding" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createRoleBinding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        default: { $ref: "#/components/responses/Error" }
  /role-bindings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [security]
      operationId: getRoleBinding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleBinding" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      operationId: deleteRoleBinding
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /gitlab-trust-policies:
    get:
      tags: [security]
      operationId: listGitLabTrustPolicies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitLabTrustPolicy" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [security]
      operationId: createGitLabTrustPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitLabTrustPolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitLabTrustPolicy" }
        default: { $ref: "#/components/responses/Error" }
  /gitlab-trust-policies/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [security]
      operationId: getGitLabTrustPolicy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitLabTrustPolicy" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [security]
      operationId: updateGitLabTrustPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitLabTrustPolicyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitLabTrustPolicy" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [security]
      operationId: deleteGitLabTrustPolicy
      description: Also deletes role bindings that reference the policy.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repositories/{name}/signing-key:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [repositories]
      operationId: getSigningKey
      summary: Public signing key of an Apt/Yum repository (created on first use)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [repositories]
      operationId: importSigningKey
      summary: Replace the signing key with an imported OpenPGP private key (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SigningKeyImport" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/signing-key/rotate:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [repositories]
      operationId: rotateSigningKey
      summary: Generate a new signing key and re-sign metadata (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKey" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/cleanup:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [cleanup]
      operationId: runRepositoryCleanup
      summary: Run the repository's cleanup policies now (admin)
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean } }
        - { name: policy, in: query, description: Run only this policy, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupRunResult" }
        default: { $ref: "#/components/responses/Error" }

  /scanners:
    get:
      tags: [scanning]
      operationId: listScanners
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scanner" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [scanning]
      operationId: createScanner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScannerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scanner" }
        default: { $ref: "#/components/responses/Error" }
  /scanners/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [scanning]
      operationId: getScanner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scanner" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [scanning]
      operationId: updateScanner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScannerInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scanner" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [scanning]
      operationId: deleteScanner
      description: Fails with 409 while repositories use the scanner.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /scanners/{name}/test:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [scanning]
      operationId: testScanner
      summary: Check the scanner is reachable and report its version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScannerTestResult" }
        default: { $ref: "#/components/responses/Error" }
  /components/{id}/scan:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [scanning]
      operationId: scanComponent
      summary: Queue scans of a component now
      description: Requires write permission on the repository. Without a body, the repository's configured scanners are used.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanJob" }
        default: { $ref: "#/components/responses/Error" }
  /components/{id}/scans:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [scanning]
      operationId: getComponentScans
      summary: Latest scan results, findings and recent jobs of a component
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentScans" }
        default: { $ref: "#/components/responses/Error" }
  /scan-jobs:
    get:
      tags: [scanning]
      operationId: listScanJobs
      summary: Scan queue (admin)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, done, failed] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanJob" }
        default: { $ref: "#/components/responses/Error" }
  /scan-jobs/{id}/artifact:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [scanning]
      operationId: getScanJobArtifact
      summary: Download the artifact of a running webhook scan job
      description: Authenticated by the per-job token sent to the webhook (query parameter or Bearer header).
      security: []
      parameters:
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200":
          description: Artifact content (an OCI image layout tar for Docker images)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
  /scan-jobs/{id}/result:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [scanning]
      operationId: submitScanJobResult
      summary: Webhook scanner callback with scan results
      description: Authenticated by the per-job token (Bearer header or `token` query parameter).
      security: []
      parameters:
        - { name: token, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanCallback" }
      responses:
        "204": { description: Accepted }
        default: { $ref: "#/components/responses/Error" }
  /waivers:
    get:
      tags: [scanning]
      operationId: listWaivers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Waiver" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [scanning]
      operationId: createWaiver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        default: { $ref: "#/components/responses/Error" }
  /waivers/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [scanning]
      operationId: getWaiver
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [scanning]
      operationId: updateWaiver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaiverInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [scanning]
      operationId: deleteWaiver
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /cleanup-policies:
    get:
      tags: [cleanup]
      operationId: listCleanupPolicies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CleanupPolicy" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [cleanup]
      operationId: createCleanupPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupPolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        default: { $ref: "#/components/responses/Error" }
  /cleanup-policies/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [cleanup]
      operationId: getCleanupPolicy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [cleanup]
      operationId: updateCleanupPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupPolicyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupPolicy" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [cleanup]
      operationId: deleteCleanupPolicy
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /cleanup-policies/{name}/preview:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [cleanup]
      operationId: previewCleanupPolicy
      summary: Dry run of a policy against a repository
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupRunResult" }
        default: { $ref: "#/components/responses/Error" }

  /routing-rules:
    get:
      tags: [routing]
      operationId: listRoutingRules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoutingRule" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [routing]
      operationId: createRoutingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingRuleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingRule" }
        default: { $ref: "#/components/responses/Error" }
  /routing-rules/{name}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [routing]
      operationId: getRoutingRule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingRule" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [routing]
      operationId: updateRoutingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingRuleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingRule" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [routing]
      operationId: deleteRoutingRule
      description: Fails with 409 while proxy repositories use the rule.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /routing-rules/{name}/test:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    post:
      tags: [routing]
      operationId: testRoutingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, example: "@acme/widgets" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutingTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /metrics/overview:
    get:
      tags: [metrics]
      operationId: getMetricsOverview
      summary: Usage dashboard data
      description: |
        Requests, downloads, uploads, traffic and cache efficiency over time, plus
        content inventory and scan status. Scoped to the repositories the caller
        can read (administrators see everything, plus storage per blob store).
      security:
        - bearerAuth: []
        - basicAuth: []
        - sessionCookie: []
        - {}
      parameters:
        - { $ref: "#/components/parameters/UsageRange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageOverview" }
        default: { $ref: "#/components/responses/Error" }
  /repositories/{name}/metrics:
    parameters:
      - { $ref: "#/components/parameters/Name" }
    get:
      tags: [metrics]
      operationId: getRepositoryMetrics
      summary: Usage of one repository
      parameters:
        - { $ref: "#/components/parameters/UsageRange" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryUsageReport" }
        default: { $ref: "#/components/responses/Error" }
  /activity:
    get:
      tags: [metrics]
      operationId: listActivity
      summary: Activity log of downloads, uploads and deletes
      description: |
        Administrators see all repositories; repository administrators can query
        their repositories with `repository=`. Use `format=csv` to export.
      parameters:
        - { name: repository, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [download, upload, delete] } }
        - { name: actor, in: query, description: Substring of the actor, schema: { type: string } }
        - { name: path, in: query, description: Substring of the asset path, schema: { type: string } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { name: before, in: query, description: Return events with a smaller id (paging), schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/ExportFormat" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
            text/csv:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Entrepot API token, OIDC access token or GitLab CI id_token
    basicAuth:
      type: http
      scheme: basic
      description: Any username; the password is a token
    sessionCookie:
      type: apiKey
      in: cookie
      name: entrepot_session
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    UsageRange:
      name: range
      in: query
      description: Time window (default 24h)
      schema: { type: string, enum: [1h, 24h, 7d, 30d] }
    From:
      name: from
      in: query
      description: Only events at or after this time
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Only events before this time
      schema: { type: string, format: date-time }
    ExportFormat:
      name: format
      in: query
      description: json (default) or csv
      schema: { type: string, enum: [json, csv] }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
    SystemInfo:
      type: object
      required: [version, baseUrl, formats, oidc, gitlabInstances, anonymousAccess]
      properties:
        version: { type: string }
        baseUrl: { type: string }
        formats:
          type: array
          items: { $ref: "#/components/schemas/FormatInfo" }
        oidc:
          type: object
          required: [enabled, displayName]
          properties:
            enabled: { type: boolean }
            displayName: { type: string }
        gitlabInstances:
          type: array
          items: { type: string }
        anonymousAccess: { type: boolean }
    FormatInfo:
      type: object
      required: [name, kinds]
      properties:
        name: { type: string, example: npm }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/RepositoryKind" }
    Me:
      type: object
      required: [kind, name, groups, policies, scopes, admin]
      properties:
        kind: { type: string, enum: [anonymous, user, gitlab, bootstrap] }
        name: { type: string }
        givenName: { type: string, description: User's first name }
        userId: { type: string }
        email: { type: string }
        groups: { type: array, items: { type: string } }
        policies: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        admin: { type: boolean }
        claims:
          type: object
          additionalProperties: true
    AuditEvent:
      type: object
      required: [id, at, actor, action, target, details, remoteIp]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: object, additionalProperties: true }
        remoteIp: { type: string }

    BlobStoreType:
      type: string
      enum: [file, s3]
    FileBlobStoreConfig:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Directory on a mounted volume (PVC, EBS, EFS). Must be under storage.allowedRoots.
          example: /data/default
    S3BlobStoreConfig:
      type: object
      required: [bucket]
      properties:
        bucket: { type: string }
        region: { type: string }
        prefix: { type: string }
        endpoint: { type: string, description: Custom endpoint for MinIO / Ceph }
        forcePathStyle: { type: boolean }
        accessKeyId: { type: string, description: Leave empty to use the AWS default chain (IRSA) }
        secretAccessKey: { type: string, writeOnly: true }
        redirectDownloads:
          type: boolean
          description: Redirect large downloads to presigned S3 URLs
    BlobStoreInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        type: { $ref: "#/components/schemas/BlobStoreType" }
        file: { $ref: "#/components/schemas/FileBlobStoreConfig" }
        s3: { $ref: "#/components/schemas/S3BlobStoreConfig" }
    BlobStore:
      type: object
      required: [name, type, usage, createdAt, updatedAt]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/BlobStoreType" }
        file: { $ref: "#/components/schemas/FileBlobStoreConfig" }
        s3: { $ref: "#/components/schemas/S3BlobStoreConfig" }
        usage:
          type: object
          required: [blobCount, totalBytes, repositories]
          properties:
            blobCount: { type: integer, format: int64 }
            totalBytes: { type: integer, format: int64 }
            repositories: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RepositoryKind:
      type: string
      enum: [hosted, proxy, group]
    ProxySettings:
      type: object
      required: [remoteUrl]
      properties:
        remoteUrl: { type: string, example: "https://registry.npmjs.org" }
        username: { type: string }
        password: { type: string, writeOnly: true }
        metadataTtlSeconds: { type: integer, description: "Default 3600" }
        contentTtlSeconds: { type: integer, description: "0 = artifacts never expire (default)" }
        negativeCacheTtlSeconds: { type: integer, description: "Default 300; -1 disables" }
        routingRule: { type: string, description: Name of a routing rule that limits which paths/packages are fetched upstream }
    HostedSettings:
      type: object
      properties:
        allowRedeploy: { type: boolean, description: "Allow overwriting existing artifacts/versions. For Docker it allows moving tags. Defaults to false, except true for Docker." }
        apt: { $ref: "#/components/schemas/AptHostedSettings" }
        yum: { $ref: "#/components/schemas/YumHostedSettings" }
    AptHostedSettings:
      type: object
      properties:
        distributions:
          type: array
          description: Distributions to publish (default one "stable" distribution with component "main")
          items: { $ref: "#/components/schemas/AptDistribution" }
    AptDistribution:
      type: object
      required: [name]
      properties:
        name: { type: string, example: stable }
        components: { type: array, items: { type: string }, example: [main] }
        architectures: { type: array, items: { type: string }, example: [amd64, arm64, all] }
        origin: { type: string }
        label: { type: string }
    YumHostedSettings:
      type: object
      properties:
        repodataDepth:
          type: integer
          minimum: 0
          maximum: 5
          description: "Directory depth at which repodata is generated (0 = repository root, 2 = e.g. el9/x86_64/)"
    GroupSettings:
      type: object
      required: [members]
      properties:
        members:
          type: array
          description: Member repositories, searched in order
          items: { type: string }
        preferHosted:
          type: boolean
          description: "npm/PyPI: never serve a package name from proxy members if any hosted member has it (dependency-confusion protection). Default true."
    ScanSettings:
      type: object
      properties:
        scanners:
          type: array
          description: Scanners to run (names). Empty disables scanning for the repository.
          items: { type: string }
        onUpload: { type: boolean, description: Scan components when uploaded (default true) }
        onProxyFetch: { type: boolean, description: Scan components when first cached by a proxy (default true) }
        mode:
          type: string
          enum: [off, warn, quarantine]
          description: "warn: record findings only; quarantine: block downloads of components with findings at or above severityThreshold"
        severityThreshold:
          type: string
          enum: [critical, high, medium, low]
          description: "Lowest severity that quarantines (default high)"
        blockUntilScanned: { type: boolean, description: "quarantine mode: block downloads until the first scan completes" }
        holdSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: >-
            quarantine mode with blockUntilScanned: keep a download of content that is still being scanned open for
            up to this many seconds, waiting for the verdict (0, the default, refuses it at once with 403). When the
            hold runs out the client gets 503 with Retry-After and X-Entrepot-Scan-Pending.
        blockOnError:
          type: boolean
          description: >-
            quarantine mode: block downloads of components whose latest scan by a configured scanner failed, until a
            retry succeeds (failed scans are retried every scan.errorRetryInterval). Verdicts become strict: a
            component stays pending until every configured scanner has scanned its current content.
        distro: { type: string, description: "Apt/Yum: distribution for vulnerability matching, e.g. debian-12, ubuntu-24.04, rocky-9" }
    CleanupSettings:
      type: object
      properties:
        policies:
          type: array
          items: { type: string }
    RepositoryInput:
      type: object
      required: [name, format, kind, blobStore]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        format: { type: string, enum: [raw, pypi, npm, docker, apt, yum, helm] }
        kind: { $ref: "#/components/schemas/RepositoryKind" }
        blobStore: { type: string }
        description: { type: string }
        online: { type: boolean, default: true }
        anonymousRead: { type: boolean, default: false }
        proxy: { $ref: "#/components/schemas/ProxySettings" }
        hosted: { $ref: "#/components/schemas/HostedSettings" }
        group: { $ref: "#/components/schemas/GroupSettings" }
        scan: { $ref: "#/components/schemas/ScanSettings" }
        cleanup: { $ref: "#/components/schemas/CleanupSettings" }
    Repository:
      type: object
      required: [name, format, kind, blobStore, description, online, anonymousRead, url, permissions, createdAt, updatedAt]
      properties:
        name: { type: string }
        format: { type: string }
        kind: { $ref: "#/components/schemas/RepositoryKind" }
        blobStore: { type: string }
        description: { type: string }
        online: { type: boolean }
        anonymousRead: { type: boolean }
        url: { type: string, description: URL for package clients }
        proxy: { $ref: "#/components/schemas/ProxySettings" }
        hosted: { $ref: "#/components/schemas/HostedSettings" }
        group: { $ref: "#/components/schemas/GroupSettings" }
        scan: { $ref: "#/components/schemas/ScanSettings" }
        cleanup: { $ref: "#/components/schemas/CleanupSettings" }
        permissions:
          type: array
          description: Actions the caller may perform
          items: { type: string }
        stats: { $ref: "#/components/schemas/RepositoryStats" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepositoryStats:
      type: object
      required: [assets, components, totalBytes]
      properties:
        assets: { type: integer, format: int64 }
        components: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }

    Asset:
      type: object
      required: [id, repository, path, digest, size, contentType, createdBy, createdAt, updatedAt, attrs]
      properties:
        id: { type: string }
        repository: { type: string }
        componentId: { type: string }
        path: { type: string }
        digest: { type: string, example: "sha256:…" }
        size: { type: integer, format: int64 }
        contentType: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cachedAt: { type: string, format: date-time }
        lastDownloadedAt: { type: string, format: date-time }
        downloadUrl: { type: string }
        attrs: { type: object, additionalProperties: true }
        uploader:
          type: object
          additionalProperties: true
          description: Who stored the asset (kind, name; GitLab CI jobs include project_path, ref, sha, pipeline_id)
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        next: { type: string, description: Pass as `after` to fetch the next page }
    BrowseEntry:
      type: object
      required: [name, path, isDir, size]
      properties:
        name: { type: string }
        path: { type: string }
        isDir: { type: boolean }
        assetId: { type: string }
        size: { type: integer, format: int64 }
    Component:
      type: object
      required: [id, repository, format, name, version, createdAt, updatedAt, attrs]
      properties:
        id: { type: string }
        repository: { type: string }
        format: { type: string }
        name: { type: string }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attrs: { type: object, additionalProperties: true }
        scanState: { $ref: "#/components/schemas/ScanState" }
        quarantined: { type: boolean }
        scannedAt: { type: string, format: date-time }
        findingCounts: { $ref: "#/components/schemas/SeverityCounts" }
        findings:
          type: array
          description: Search with `withFindings` only. The most severe unwaived findings, at most five (`findingCounts` counts all of them).
          items: { $ref: "#/components/schemas/Finding" }
    ComponentDetail:
      type: object
      required: [component, assets]
      properties:
        component: { $ref: "#/components/schemas/Component" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    User:
      type: object
      required: [id, username, issuer, subject, email, displayName, groups, serviceAccount, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        issuer: { type: string }
        subject: { type: string }
        email: { type: string }
        displayName: { type: string }
        groups: { type: array, items: { type: string } }
        serviceAccount: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    ServiceAccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        description: { type: string }
    ApiTokenInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        scopes:
          type: array
          description: Restrict the token to these actions (default unrestricted)
          items: { type: string, enum: [read, write, delete, admin] }
        expiresInDays: { type: integer, minimum: 1, description: Omit for no expiry }
    ApiToken:
      type: object
      required: [id, name, hint, scopes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        hint: { type: string, example: "ent_AbCd…wXyZ" }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret: { type: string, description: The token value. Shown only once. }

    Action:
      type: string
      enum: [read, write, delete, admin]
    RoleInput:
      type: object
      required: [name, actions]
      properties:
        name: { type: string }
        description: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
    Role:
      type: object
      required: [name, description, actions, builtin]
      properties:
        name: { type: string }
        description: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        builtin: { type: boolean }
    SubjectType:
      type: string
      enum: [user, group, gitlab_policy, authenticated]
    RoleBindingInput:
      type: object
      required: [role, subjectType]
      properties:
        role: { type: string }
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        subject:
          type: string
          description: Username, OIDC group, or trust policy name (empty for authenticated)
        repositoryPattern:
          type: string
          default: "*"
          description: "Glob over repository names; `*` on a role with admin grants system admin"
    RoleBinding:
      type: object
      required: [id, role, subjectType, subject, repositoryPattern, createdAt]
      properties:
        id: { type: string }
        role: { type: string }
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        subject: { type: string }
        repositoryPattern: { type: string }
        createdAt: { type: string, format: date-time }
    GitLabTrustPolicyInput:
      type: object
      required: [name, gitlab, conditions]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        description: { type: string }
        gitlab: { type: string, description: Name of a trusted GitLab instance from server configuration }
        conditions:
          type: object
          description: |
            id_token claim -> glob pattern. All must match. Common claims:
            project_path, namespace_path, ref, ref_type, ref_protected,
            environment, pipeline_source.
          additionalProperties: { type: string }
          example:
            project_path: "platform/**"
            ref_protected: "true"
    GitLabTrustPolicy:
      type: object
      required: [name, description, gitlab, conditions, createdAt, updatedAt]
      properties:
        name: { type: string }
        description: { type: string }
        gitlab: { type: string }
        conditions:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Severity:
      type: string
      enum: [critical, high, medium, low, unknown]
    ScanState:
      type: string
      enum: [unscanned, pending, clean, vulnerable, error, unsupported]
    SigningKey:
      type: object
      required: [fingerprint, publicKey, createdAt, url]
      properties:
        fingerprint: { type: string }
        algorithm: { type: string }
        publicKey: { type: string, description: ASCII-armored OpenPGP public key }
        url: { type: string, description: Where package clients download the public key }
        createdAt: { type: string, format: date-time }
    SigningKeyImport:
      type: object
      required: [privateKey]
      properties:
        privateKey: { type: string, writeOnly: true, description: ASCII-armored OpenPGP private key }
        passphrase: { type: string, writeOnly: true }
    ScannerType:
      type: string
      enum: [trivy, grype, webhook, metadefender]
    TrivySettings:
      type: object
      properties:
        binary: { type: string, description: Path to the trivy CLI (default "trivy") }
        serverUrl: { type: string, description: Trivy server for client/server mode (recommended; keeps one vulnerability DB) }
        serverToken: { type: string, writeOnly: true }
        timeoutSeconds: { type: integer }
        extraArgs: { type: array, items: { type: string } }
    GrypeSettings:
      type: object
      properties:
        binary: { type: string, description: Path to the grype CLI (default "grype") }
        timeoutSeconds: { type: integer }
        extraArgs: { type: array, items: { type: string } }
    WebhookScannerSettings:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Endpoint that receives scan requests }
        secret: { type: string, writeOnly: true, description: HMAC-SHA256 key for the X-Entrepot-Signature header }
        timeoutSeconds: { type: integer, description: Time allowed for the callback (default 900) }
    MetaDefenderSettings:
      type: object
      required: [url]
      description: >-
        OPSWAT MetaDefender Core. Every file of a component (except sidecars such as PyPI .metadata), or
        every layer of a Docker image, is uploaded for analysis, or matched by hash with an earlier
        analysis by the same rule.
      properties:
        url: { type: string, description: "MetaDefender Core REST API, e.g. https://metadefender.example.com:8008" }
        apiKey: { type: string, writeOnly: true, description: Sent in the apikey header; kept when omitted on update and the URL is unchanged }
        rule: { type: string, description: Rule (workflow) to process files with; empty for the server default }
        timeoutSeconds: { type: integer, description: Time allowed to analyse all files of a component (default 600) }
        concurrency: { type: integer, minimum: 0, maximum: 32, description: Files analysed at once (default 4) }
        hashLookup: { type: boolean, description: Reuse earlier analyses of the same content by the same rule (default true) }
        maxResultAgeHours: { type: integer, minimum: 0, description: Age after which earlier analyses are not reused (default 24) }
        webUrl: { type: string, description: "Link to results in the MetaDefender console; {dataId} is replaced" }
        caCertificate: { type: string, description: PEM certificates trusted for url (internal CAs) }
    ScannerInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        type: { $ref: "#/components/schemas/ScannerType" }
        enabled: { type: boolean, default: true }
        rescanIntervalHours: { type: integer, description: Re-scan components periodically (0 = never) }
        trivy: { $ref: "#/components/schemas/TrivySettings" }
        grype: { $ref: "#/components/schemas/GrypeSettings" }
        webhook: { $ref: "#/components/schemas/WebhookScannerSettings" }
        metadefender: { $ref: "#/components/schemas/MetaDefenderSettings" }
    Scanner:
      type: object
      required: [name, type, enabled, rescanIntervalHours, createdAt, updatedAt]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/ScannerType" }
        enabled: { type: boolean }
        rescanIntervalHours: { type: integer }
        trivy: { $ref: "#/components/schemas/TrivySettings" }
        grype: { $ref: "#/components/schemas/GrypeSettings" }
        webhook: { $ref: "#/components/schemas/WebhookScannerSettings" }
        metadefender: { $ref: "#/components/schemas/MetaDefenderSettings" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScannerTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        version: { type: string }
    ScanRequest:
      type: object
      properties:
        scanners: { type: array, items: { type: string } }
    ScanJob:
      type: object
      required: [id, componentId, component, repository, scanner, status, reason, attempts, error, createdAt, updatedAt]
      properties:
        id: { type: string }
        componentId: { type: string }
        component: { type: string, description: name@version }
        repository: { type: string }
        scanner: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        reason: { type: string, enum: [upload, proxy, manual, rescan, retry] }
        attempts: { type: integer }
        error: { type: string }
        runAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Finding:
      type: object
      required: [vulnId, kind, severity, package, installedVersion, fixedVersion, title, url, waived]
      properties:
        vulnId:
          type: string
          example: CVE-2021-23337
          description: >-
            Vulnerability id, or for threats found by file scanners MALWARE:, SUSPICIOUS: or PUA: and the
            threat name, or BLOCKED: and the reason the scanner's policy refused the file.
        kind:
          type: string
          enum: [vulnerability, malware, policy]
          description: Derived from vulnId. Waivers for "*" do not cover malware and policy findings.
        severity: { $ref: "#/components/schemas/Severity" }
        package: { type: string, description: Package, or for file scanners the file (and path inside an archive) }
        installedVersion: { type: string, description: Installed version, or for file scanners the start of the file's sha256 }
        fixedVersion: { type: string }
        title: { type: string }
        url: { type: string }
        waived: { type: boolean }
        waiverId: { type: string }
    SeverityCounts:
      type: object
      required: [critical, high, medium, low, unknown]
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }
    ScanResult:
      type: object
      required: [id, scanner, status, scannedAt, counts, findings]
      properties:
        id: { type: string }
        scanner: { type: string }
        status: { type: string, enum: [ok, error, unsupported] }
        scannedAt: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/SeverityCounts" }
        target: { type: string, description: What was scanned (purl or image reference) }
        error: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        files:
          type: array
          description: How each file was analysed (file scanners)
          items: { $ref: "#/components/schemas/ScannedFile" }
    ScannedFile:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sha256: { type: string }
        dataId: { type: string, description: The scanner's id of the analysis }
        result: { type: string, example: No Threat Detected }
        cached: { type: boolean, description: An earlier analysis of the same content was reused }
    ComponentScans:
      type: object
      required: [scanState, quarantined, results, jobs]
      properties:
        scanState: { $ref: "#/components/schemas/ScanState" }
        quarantined: { type: boolean }
        quarantineReason: { type: string }
        scannedAt: { type: string, format: date-time }
        results:
          type: array
          description: Latest result per scanner
          items: { $ref: "#/components/schemas/ScanResult" }
        jobs:
          type: array
          description: Recent jobs
          items: { $ref: "#/components/schemas/ScanJob" }
    ScanCallback:
      type: object
      properties:
        format:
          type: string
          enum: [entrepot, sarif, cyclonedx]
          description: "Format of the results: native findings, a SARIF 2.1 log, or a CycloneDX document with vulnerabilities"
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        document: { type: object, additionalProperties: true, description: SARIF or CycloneDX document }
        error: { type: string, description: Report a scan failure instead of results }
        unsupported: { type: boolean, description: The scanner cannot scan this kind of artifact }
    WaiverInput:
      type: object
      required: [vulnId]
      properties:
        vulnId: { type: string, description: "Vulnerability ID, or * for any" }
        repositoryPattern: { type: string, default: "*" }
        componentPattern: { type: string, default: "*", description: 'Glob over "name" or "name@version"' }
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
    Waiver:
      type: object
      required: [id, vulnId, repositoryPattern, componentPattern, reason, createdBy, createdAt]
      properties:
        id: { type: string }
        vulnId: { type: string }
        repositoryPattern: { type: string }
        componentPattern: { type: string }
        reason: { type: string }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    CleanupCriteria:
      type: object
      description: All set criteria must match for a component to be removed.
      properties:
        publishedOlderThanDays: { type: integer, minimum: 1 }
        lastDownloadedOlderThanDays: { type: integer, minimum: 1, description: Components never downloaded count by their publish date }
        nameRegex: { type: string }
        versionRegex: { type: string }
        prereleaseOnly: { type: boolean, description: Only versions with a pre-release part (1.2.0-rc.1, 1.0.0.dev3) }
        keepLatest: { type: integer, minimum: 0, description: Always keep this many newest versions of each component }
        untaggedOlderThanDays: { type: integer, minimum: 1, description: "Docker: delete untagged manifests (and unreferenced layers) older than this" }
    CleanupPolicyInput:
      type: object
      required: [name, criteria]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        description: { type: string }
        format: { type: string, description: Restrict to one format (empty = any) }
        criteria: { $ref: "#/components/schemas/CleanupCriteria" }
    CleanupPolicy:
      type: object
      required: [name, description, format, criteria, createdAt, updatedAt]
      properties:
        name: { type: string }
        description: { type: string }
        format: { type: string }
        criteria: { $ref: "#/components/schemas/CleanupCriteria" }
        repositories: { type: array, items: { type: string }, description: Repositories using the policy }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CleanupRunResult:
      type: object
      required: [dryRun, repositories, components, assets, bytes]
      properties:
        dryRun: { type: boolean }
        repositories: { type: array, items: { type: string } }
        components:
          type: array
          description: Components deleted (or that would be)
          items: { $ref: "#/components/schemas/Component" }
        assets: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }

    RoutingRuleInput:
      type: object
      required: [name, mode, matchers]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        description: { type: string }
        mode:
          type: string
          enum: [allow, block]
          description: "allow: only matching requests go upstream; block: matching requests never go upstream"
        matchers:
          type: array
          description: Regular expressions over the request path / package name, e.g. "^@acme/" or "^acme-"
          items: { type: string }
    RoutingRule:
      type: object
      required: [name, description, mode, matchers, createdAt, updatedAt]
      properties:
        name: { type: string }
        description: { type: string }
        mode: { type: string, enum: [allow, block] }
        matchers: { type: array, items: { type: string } }
        repositories: { type: array, items: { type: string }, description: Proxy repositories using the rule }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoutingTestResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        matched: { type: string, description: The matcher that decided }

    UsageCounts:
      type: object
      required: [requests, errors, downloads, uploads, bytesOut, bytesIn, cacheHits, cacheMisses]
      properties:
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64, description: Server errors (5xx) }
        downloads: { type: integer, format: int64 }
        uploads: { type: integer, format: int64 }
        bytesOut: { type: integer, format: int64 }
        bytesIn: { type: integer, format: int64 }
        cacheHits: { type: integer, format: int64, description: Proxy requests served from cache }
        cacheMisses: { type: integer, format: int64, description: Proxy requests fetched from the upstream }
    UsagePoint:
      type: object
      required: [t, requests, errors, downloads, uploads, bytesOut, bytesIn]
      properties:
        t: { type: string, format: date-time }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        downloads: { type: integer, format: int64 }
        uploads: { type: integer, format: int64 }
        bytesOut: { type: integer, format: int64 }
        bytesIn: { type: integer, format: int64 }
    RepositoryUsage:
      type: object
      required: [repository, format, kind, counts]
      properties:
        repository: { type: string }
        format: { type: string }
        kind: { type: string }
        counts: { $ref: "#/components/schemas/UsageCounts" }
    FormatInventory:
      type: object
      required: [format, repositories, components, assets, totalBytes]
      properties:
        format: { type: string }
        repositories: { type: integer, format: int64 }
        components: { type: integer, format: int64 }
        assets: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
    BlobStoreSummary:
      type: object
      required: [name, type, blobCount, totalBytes, repositories]
      properties:
        name: { type: string }
        type: { type: string }
        blobCount: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        repositories: { type: integer, format: int64 }
    UsageOverview:
      type: object
      required: [range, from, bucketSeconds, scope, totals, requestRate, series, topRepositories, inventory, scan]
      properties:
        range: { type: string }
        from: { type: string, format: date-time }
        bucketSeconds: { type: integer }
        scope: { type: string, enum: [readable, all], description: "readable: only repositories the caller can read" }
        totals: { $ref: "#/components/schemas/UsageCounts" }
        requestRate: { type: number, description: Requests per second over the last 5 minutes }
        series:
          type: array
          items: { $ref: "#/components/schemas/UsagePoint" }
        topRepositories:
          type: array
          items: { $ref: "#/components/schemas/RepositoryUsage" }
        inventory:
          type: array
          description: Repositories and content per format
          items: { $ref: "#/components/schemas/FormatInventory" }
        scan:
          type: object
          description: Components by scan state (plus quarantined)
          additionalProperties: { type: integer, format: int64 }
        storage:
          type: array
          description: Blob store usage (administrators only)
          items: { $ref: "#/components/schemas/BlobStoreSummary" }
    RepositoryUsageReport:
      type: object
      required: [repository, range, from, bucketSeconds, totals, requestRate, series]
      properties:
        repository: { type: string }
        range: { type: string }
        from: { type: string, format: date-time }
        bucketSeconds: { type: integer }
        totals: { $ref: "#/components/schemas/UsageCounts" }
        requestRate: { type: number }
        series:
          type: array
          items: { $ref: "#/components/schemas/UsagePoint" }
    ActivityEvent:
      type: object
      required: [id, at, repository, format, kind, path, actor, actorKind, remoteIp, userAgent, bytes]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        repository: { type: string }
        format: { type: string }
        kind: { type: string, enum: [download, upload, delete] }
        path: { type: string }
        componentId: { type: string }
        component: { type: string, description: name@version }
        actor: { type: string }
        actorKind: { type: string }
        remoteIp: { type: string }
        userAgent: { type: string }
        bytes: { type: integer, format: int64 }
