name: Release

# Builds the signed release artifacts and publishes the GitHub release, which
# the Terraform Registry and the OpenTofu registry both import.
#
# release-please.yml calls this after a release PR is merged, with the draft
# release it created. goreleaser uploads the zips, SHA256SUMS, its signature
# and the registry manifest to that draft, then publishes it, so the registries
# never see a release without its files.
#
# Run it by hand ("Run workflow", with the tag) to finish a draft release whose
# publish job didn't complete.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        type: string
        required: true
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of a draft release, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # A full build takes about 5 minutes; anything much longer is a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the draft release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
          if ! gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            echo "::error::There is no release $TAG. Releases start from a merged release-please PR."
            exit 1
          fi
          if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != true ]; then
            echo "::error::Release $TAG is already published."
            exit 1
          fi
          target="$(jq -r .targetCommitish "$RUNNER_TEMP/release.json")"
          sha="$(git rev-parse --verify "$target^{commit}" 2>/dev/null || git rev-parse --verify "origin/$target^{commit}")"
          # release-please creates the tag with the draft (force-tag-creation);
          # create it here if it doesn't exist, since goreleaser needs it.
          remote="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)"
          if [ -z "$remote" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
          elif [ "$remote" != "$sha" ]; then
            echo "::error::Tag $TAG points at $remote, but the release targets $sha."
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          echo "Releasing $TAG ($sha)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          # Read by the signs step in .goreleaser.yml (gpg --passphrase-fd 0).
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
