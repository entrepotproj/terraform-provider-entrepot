name: Release Please

# On every push to main, release-please keeps a release PR open with the next
# version (from Conventional Commit messages) and its CHANGELOG entry. Merging
# that PR creates a draft GitHub release and its tag; the publish job then runs
# goreleaser, which uploads the signed artifacts and publishes the release.
# See PUBLISHING.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # Optional: a GitHub App or fine-grained token, so the release PR
          # triggers CI. GITHUB_TOKEN works, but its PRs don't run workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}
